<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Archive Index — Carol Christian Poell</title>
<meta name="description" content="현재 판매 중인 캐롤 크리스찬 포엘 매물">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121110">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Two families, one request. Inter for what is read, IBM Plex Mono for what
     is looked up: model numbers, seasons, prices, labels. Korean falls to the
     device's own sans, as on the Helmut Lang index.                        -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* A dark sheet: black leather, raw grey, object-dyed brown in the photos
     themselves; the page stays out of their way with no colour of its own.
     Contrast on --paper, measured: ink 15.5 > mid 8.7 > soft 5.4 (on the
     photo tint 14.5 · 8.1 · 5.1 — every text size passes 4.5:1) · line 3.3,
     for the hairline marks only, never text.                             */
  --paper:#121110; --ink:#ece8e1; --mid:#b5afa5; --soft:#8f897f;
  --line:#6a655d;
  --hair:#2b2926; --hair2:#1e1c1a; --tint:#1a1817;
  /* Plex Mono has no Hangul: a Korean word in a mono line falls, glyph by
     glyph, past the Latin monospaces to the device's own Korean sans      */
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',monospace;
  --sans:'Inter','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',system-ui,sans-serif;
  --gut:36px; --cols:5; --gapc:24px; --gapr:50px; --maxw:1840px; --barh:46px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);overflow-x:hidden;
  /* Korean falls to the device's own sans; Noto Sans KR is named last for
     anyone who happens to have it installed, never downloaded. */
  font-family:var(--sans);
  font-size:13px;line-height:1.6;font-weight:400;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0}
button{cursor:pointer}
::selection{background:var(--ink);color:var(--paper)}
.srf{font-family:var(--sans);font-weight:300}
.lbl{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}

/* ─────────── masthead ─────────── */
.mast{padding:40px var(--gut) 30px;text-align:left}
.mast .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);
  margin-bottom:22px}
.wm{font-family:var(--mono);font-weight:500;
  font-size:11px;letter-spacing:.32em;text-transform:uppercase;line-height:1.2;margin:0;color:var(--mid)}
.mast .sub{margin-top:10px;font-family:var(--sans);font-weight:300;font-size:clamp(24px,3.4vw,40px);
  letter-spacing:-.01em;line-height:1.1;color:var(--ink)}
.mast .tally{margin-top:16px;font-family:var(--mono);font-size:10.5px;color:var(--soft);letter-spacing:.04em}
.mast .tally b{font-weight:400;color:var(--mid)}

/* ─────────── nav bar ─────────── */
.navwrap{position:sticky;top:0;z-index:40;background:var(--paper);
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.nav{display:flex;align-items:center;gap:26px;padding:0 var(--gut);height:46px}
.cats{display:flex;align-items:center;gap:20px;flex:1;min-width:0;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none;height:100%}
.cats::-webkit-scrollbar{display:none}
.cats button{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--mid);
  white-space:nowrap;position:relative;height:100%;transition:color .15s}
.cats button:hover{color:var(--ink)}
.cats button[aria-pressed="true"]{color:var(--ink)}
.cats button[aria-pressed="true"]::after{content:'';position:absolute;left:0;right:0;bottom:-1px;
  height:1px;background:var(--ink)}
.tools{display:flex;align-items:center;gap:18px;flex:none}
.tools button,.tools label{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--mid);
  white-space:nowrap;transition:color .15s}
.tools button:hover{color:var(--ink)}
.tools button[aria-expanded="true"],.tools button[aria-pressed="true"]{color:var(--ink)}
.tools .n{color:var(--soft);margin-left:4px}
.selwrap{position:relative;display:flex;align-items:center}
.selwrap select{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--mid);
  -webkit-appearance:none;appearance:none;padding-right:14px;cursor:pointer;outline:0}
.selwrap::after{content:'';position:absolute;right:2px;top:50%;width:5px;height:5px;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  transform:translateY(-70%) rotate(45deg);pointer-events:none}
.qbox{display:flex;align-items:center;gap:9px;flex:none;width:0;overflow:hidden;
  transition:width .28s cubic-bezier(.3,0,.2,1)}
.qbox.on{width:min(280px,34vw)}
.qbox input{width:100%;font-size:12px;outline:0;border-bottom:1px solid var(--hair);padding:3px 0;
  background:transparent}
/* the closed box is 0 wide, not gone: the field stayed in the tab order and a
   keyboard user landed in an invisible input under a button saying collapsed.
   The hiding waits out the width transition, or the text blinks away first. */
.qbox input{transition:visibility 0s linear .28s}
.qbox.on input{transition:visibility 0s}
.qbox:not(.on) input{visibility:hidden}
.qbox input::placeholder{color:var(--soft)}
.qbox input:focus{border-bottom-color:var(--ink)}

/* ─────────── filter panel ─────────── */
.panel{display:none;border-bottom:1px solid var(--hair);background:var(--paper);
  padding:34px var(--gut) 0;max-height:calc(100vh - 47px);overflow-y:auto;
  position:sticky;top:46px;z-index:39}
.panel::-webkit-scrollbar{width:4px}
.panel::-webkit-scrollbar-thumb{background:var(--hair)}
.panel.on{display:block}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:30px 34px;
  max-width:1560px}
@media(min-width:960px){
  .pcol.wide{grid-column:span 2}
  #fmotif{column-count:2;column-gap:34px}
  #fmotif .opt{break-inside:avoid}
}
.pcol>.lbl{display:block;margin-bottom:13px}
.yread{margin-left:14px;color:var(--ink);letter-spacing:.12em;font-variant-numeric:tabular-nums}
.opt{display:flex;align-items:center;font-size:12px;color:var(--mid);padding:3px 0;
  line-height:1.5;transition:color .12s;text-align:left;width:100%}
.opt:hover{color:var(--ink)}
.opt[aria-pressed="true"]{color:var(--ink)}
.opt[aria-pressed="true"] .mk{background:var(--ink)}
.opt.zero{color:var(--hair);pointer-events:none}
.opt.zero .mk{border-color:var(--hair)}
.opt.zero .c{color:var(--hair)}
.mk{flex:none;width:5px;height:5px;border:1px solid var(--line);border-radius:50%;
  margin-right:8px;transition:.12s}
.opt:hover .mk{border-color:var(--ink)}
.opt .c{margin-left:auto;font-size:10px;color:var(--soft);padding-left:14px;
  font-variant-numeric:tabular-nums}
#fnoyear .opt{max-width:280px}
.yrow{display:flex;gap:3px;max-width:680px;align-items:flex-end}
.yr{flex:1;min-width:0;display:flex;flex-direction:column;transition:.12s}
.yr .bw{height:36px;display:flex;align-items:flex-end}
.yr .v{width:100%;background:var(--hair);transition:.12s}
.yr .y{margin-top:7px;font-size:9px;letter-spacing:.02em;color:var(--soft);text-align:center;
  font-variant-numeric:tabular-nums;transition:.12s;padding-top:6px;border-top:1px solid var(--hair2)}
.yr:hover .y{color:var(--ink)}
.yr:hover .v{background:var(--line)}
.yr[aria-pressed="true"] .y{color:var(--ink)}
.yr[aria-pressed="true"] .v{background:var(--ink)}
.sizein{width:100%;font-size:12px;border-bottom:1px solid var(--hair);padding:4px 0;outline:0;
  background:transparent}
.sizein:focus{border-bottom-color:var(--ink)}
.sizein::placeholder{color:var(--soft)}
.prow{display:flex;justify-content:space-between;align-items:center;margin-top:28px;
  padding:14px 0;border-top:1px solid var(--hair2);position:sticky;bottom:0;background:var(--paper)}
.prow button{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid)}
.prow button:hover{color:var(--ink)}
.prow .apply{color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:2px}

/* ─────────── applied tokens ─────────── */
.applied{display:none;align-items:center;flex-wrap:wrap;gap:8px 18px;
  padding:13px var(--gut);border-bottom:1px solid var(--hair2)}
.applied.on{display:flex}
.tok{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mid);
  display:inline-flex;align-items:center;gap:7px}
.tok:hover{color:var(--ink)}
.tok i{font-style:normal;font-size:12px;line-height:1;color:var(--soft)}
.tok:hover i{color:var(--ink)}
.applied .rst{margin-left:auto;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--soft)}
.applied .rst:hover{color:var(--ink)}

/* ─────────── grid ─────────── */
main{padding:0 var(--gut)}
.head{display:flex;align-items:baseline;justify-content:space-between;
  padding:34px 0 26px}
.head .h{font-family:var(--sans);font-weight:300;font-size:17px;
  letter-spacing:0}
.head .n{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);
  font-variant-numeric:tabular-nums}
.dist{font-size:10.5px;letter-spacing:.07em;color:var(--soft);
  padding:0 0 26px;margin-top:-14px;line-height:1.95;overflow-wrap:anywhere}
.dist>div+div{margin-top:2px}
.dist .yv{display:inline-block;margin-right:15px;white-space:nowrap}
.dist .lead{display:inline-block;margin-right:13px;text-transform:uppercase;letter-spacing:.15em;
  font-size:9px;color:var(--soft)}
.dist b{font-weight:400;color:var(--mid);font-variant-numeric:tabular-nums}
.dist .q{font-variant-numeric:tabular-nums;color:var(--soft)}
.dist .sep{margin:0 12px;color:var(--hair)}
/* arrowing down scrolls the card into view; without this it lands under the
   bar that is pinned to the top */
article{scroll-margin-top:calc(var(--barh) + 14px)}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));
  gap:var(--gapr) var(--gapc);padding-bottom:20px}
article{position:relative;display:flex;flex-direction:column}
.shot{position:relative;display:block;width:100%;aspect-ratio:4/5;background:var(--tint);
  overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s ease}
.shot img.on{opacity:1}
.shot.dead::after{content:'NO IMAGE';position:absolute;inset:0;display:grid;place-items:center;
  font-size:8.5px;letter-spacing:.2em;color:var(--mid)}
.save{position:absolute;top:10px;right:10px;z-index:2;width:22px;height:22px;
  display:grid;place-items:center;opacity:0;transition:opacity .15s}
article:hover .save,.save.on,.save:focus-visible{opacity:1}
.save span{width:7px;height:7px;border:1px solid var(--ink);border-radius:50%;display:block;
  background:transparent;transition:.12s}
.save.on span{background:var(--ink)}
.cap{padding-top:13px}
.flags{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
  margin-bottom:6px;min-height:13px}
.flags .s{color:var(--soft)}
.flags .d{color:var(--mid)}
.flags span+span::before{content:'·';margin:0 6px;color:var(--soft)}
h3.t{margin:0 0 7px;font-family:var(--sans);font-weight:400;
  font-size:13.5px;line-height:1.42;letter-spacing:0;color:var(--ink);overflow-wrap:anywhere;min-height:2.76em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
h3.t button{text-align:left;font:inherit;width:100%;transition:opacity .12s}
h3.t button:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:.5px}
.p{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;letter-spacing:0}
.p .alt{color:var(--soft);margin-left:3px;font-size:11px;white-space:nowrap}
.p .was{color:var(--soft);text-decoration:line-through;margin-left:3px;font-size:11px;white-space:nowrap}
.sub{margin-top:5px;font-size:11px;letter-spacing:.04em;color:var(--soft);overflow-wrap:anywhere}
.sub .g{color:var(--mid)}
.sub .age{color:var(--mid)}
.qv .hist{margin-top:26px;padding-top:16px;border-top:1px solid var(--hair2)}
.qv .hist .lbl{display:block;margin-bottom:10px}
.qv .hist>div{display:flex;justify-content:space-between;gap:16px;padding:5px 0;font-size:12px;
  color:var(--soft);border-bottom:1px solid var(--hair2)}
.qv .hist>div b{font-weight:400;color:var(--mid);font-variant-numeric:tabular-nums}
.qv .hist>div b .alt{color:var(--soft);margin-left:8px;font-size:11px}
.qv .hist em{font-style:normal;margin-left:9px;font-size:11px}
.qv .hist em.dn{color:var(--ink)} .qv .hist em.up{color:var(--soft)}
.qv .hist .net{border:0;padding-top:9px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mid);justify-content:flex-start}

/* ─────────── states ─────────── */
.empty{padding:110px 0 140px;text-align:center;color:var(--mid);font-size:13px}
.empty .lbl{display:block;margin-bottom:14px}
.empty p{margin:0 0 26px;font-weight:300}
.empty .drop{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:26px}
.empty .drop button{font-size:12px;color:var(--mid);padding:5px 0;display:flex;
  align-items:baseline;gap:12px}
.empty .drop button:hover{color:var(--ink)}
.empty .drop button span{font-size:10px;color:var(--soft);font-variant-numeric:tabular-nums}
.empty .rst{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);
  border-bottom:1px solid var(--hair);padding-bottom:3px}
.empty .rst:hover{color:var(--ink);border-bottom-color:var(--ink)}
.more{padding:34px 0 80px;text-align:center}
.more button{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);
  border-bottom:1px solid var(--hair);padding-bottom:4px}
.more button:hover{color:var(--ink);border-bottom-color:var(--ink)}

/* ─────────── elsewhere ───────────
   Where a platform cannot be collected — its terms, its bot wall, or a
   market that is local by design — the page still takes the search there,
   in that platform's own language. One quiet block, not a button bar. */
.seek{padding:30px 0 64px;border-top:1px solid var(--hair2)}
.seek[hidden]{display:none}
.seek .lbl{display:block;margin-bottom:5px}
.seek .qq{display:block;font-size:11px;color:var(--mid);margin-bottom:14px;overflow-wrap:anywhere}
.seek .mkt{display:flex;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--hair2);font-size:12px}
.seek .mkt>span{flex:0 0 44px;font-size:9.5px;letter-spacing:.16em;color:var(--soft)}
/* wrapped links line up under the first one, not under the market's name */
.seek .ls{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 20px}
.seek a{color:var(--mid);border-bottom:1px solid transparent;padding-bottom:1px}
.seek a:hover{color:var(--ink);border-bottom-color:var(--ink)}
.seek a i{font-style:normal;font-size:10px;color:var(--soft);margin-left:5px}
.panel .seek{padding:22px 0 4px;margin-top:28px;max-width:1560px}
.sub .ab{color:var(--mid)}
.qv .sc{margin-top:26px;padding-top:16px;border-top:1px solid var(--hair2)}
.qv .sc .lbl{display:block;margin-bottom:8px}
.qv .sc p{margin:0;font-size:12px;color:var(--mid);font-variant-numeric:tabular-nums}

/* ─────────── colophon ─────────── */
footer{border-top:1px solid var(--hair);margin-top:24px;padding:46px var(--gut) 90px}
.colo{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:30px 42px;
  max-width:1560px}
.colo .lbl{display:block;margin-bottom:10px}
.colo p{margin:0;font-size:11.5px;line-height:1.75;color:var(--mid);font-weight:300}
.sig{margin-top:44px;padding-top:18px;border-top:1px solid var(--hair2);
  font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}

/* ─────────── quick view ─────────── */
.ov{position:fixed;inset:0;z-index:80;background:var(--paper);display:none;opacity:0;
  transition:opacity .2s}
.ov.open{display:block;opacity:1}
.qvtop{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;
  justify-content:space-between;padding:0 var(--gut);z-index:3;
  border-bottom:1px solid var(--hair);background:var(--paper)}
.qvtop .lbl{color:var(--mid)}
.qvnav{display:flex;align-items:center;gap:20px}
.qvnav button{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid)}
.qvnav button:hover{color:var(--ink)}
.qvnav button:disabled{color:var(--hair);cursor:default}
.qv{position:absolute;top:52px;left:0;right:0;bottom:0;display:grid;
  grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);overflow:hidden}
.qv .pic{background:var(--tint);display:grid;place-items:center;overflow:hidden;position:relative}
.qv .pic img{width:100%;height:100%;object-fit:contain;padding:34px}
.qv .info{overflow-y:auto;padding:48px 44px 60px;border-left:1px solid var(--hair);
  display:flex;flex-direction:column}
.qv .info::-webkit-scrollbar{width:4px}
.qv .info::-webkit-scrollbar-thumb{background:var(--hair)}
.qv .flags{font-size:9px;letter-spacing:.17em;margin-bottom:14px}
.qv h2{margin:0 0 22px;font-family:var(--sans);font-weight:300;
  font-size:21px;line-height:1.35;overflow-wrap:anywhere}
.qv .big{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:0}
.qv .big .alt{font-size:12px;color:var(--soft);margin-left:5px;white-space:nowrap}
.qv .big .was{font-size:12px;color:var(--soft);text-decoration:line-through;margin-left:5px;white-space:nowrap}
.qv .kv{margin:30px 0 0;display:grid;grid-template-columns:72px 1fr;gap:10px 18px;font-size:12px}
.qv .kv dt{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);
  padding-top:2px}
.qv .kv dd{margin:0;color:var(--mid)}
.qv .tags{margin-top:18px;display:flex;flex-wrap:wrap;gap:6px 14px}
.qv .tags span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}
.qv .why{margin-top:16px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.qv .cmp{margin-top:32px;padding-top:16px;border-top:1px solid var(--hair2)}
.qv .cmp .lbl{display:block;margin-bottom:10px}
.qv .cmp a{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:12px;
  color:var(--mid);border-bottom:1px solid var(--hair2)}
.qv .cmp a img,.qv .cmp a .noimg{width:34px;height:42px;object-fit:cover;flex:none;
  background:var(--tint);display:block}
.qv .cmp a .w{flex:1;min-width:0;overflow-wrap:anywhere}
.qv .cmp a b em{display:block;font-style:normal;font-size:10.5px;color:var(--soft);
  text-align:right;margin-top:1px}
.qv .cmp .gap{margin-top:10px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--soft);font-variant-numeric:tabular-nums}
.qv .cmp a:hover{color:var(--ink)}
.qv .cmp a b{font-weight:400;font-variant-numeric:tabular-nums}
.qv .cmp a.lo{color:var(--ink)}
.qv .cmp a.lo b{border-bottom:1px solid var(--ink);padding-bottom:1px}
.qv .cmp a i{font-style:normal;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--soft);margin-left:9px}
.qv .kv .basis{font-size:10px;letter-spacing:.08em;color:var(--soft);display:block;margin-top:2px}
.qv .cta{padding-top:42px;display:flex;align-items:center;gap:26px}
.qv .cta a{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);
  border-bottom:1px solid var(--ink);padding-bottom:4px}
.qv .cta button{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mid)}
.qv .cta button:hover{color:var(--ink)}
.qvx{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid)}
.qvx:hover{color:var(--ink)}

.top{position:fixed;right:0;bottom:0;z-index:51;font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mid);background:var(--paper);
  padding:9px var(--gut) 11px;border-top:1px solid var(--hair2);border-left:1px solid var(--hair2);
  opacity:0;pointer-events:none;transition:opacity .2s}
.top.show{opacity:1;pointer-events:auto}
.top:hover{color:var(--ink)}
.kbd{position:fixed;left:0;bottom:0;z-index:50;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--soft);opacity:0;transition:opacity .2s;pointer-events:none;
  background:var(--paper);padding:9px var(--gut) 11px;border-top:1px solid var(--hair2);
  border-right:1px solid var(--hair2)}
@media(hover:hover) and (min-width:1024px){ body:not(.noqv) .kbd.show{opacity:.92} }

/* ─────────── device ladder ───────────
   The column count is now stated per range instead of left to auto-fill.
   auto-fill with a 230px floor gave 2 columns at 768px — a 347x434 photo,
   about one garment per screen on an iPad held upright — and 9 columns at
   2560px, where the eye cannot track a row. Stated counts hold the card
   between roughly 220 and 285px at every width, which is the size the 4/5
   photo was drawn for.                                                     */
@media(max-width:399px){  :root{--gut:16px;--cols:2;--gapc:12px;--gapr:30px} }
@media(min-width:400px) and (max-width:599px){  :root{--gut:20px;--cols:2;--gapc:14px;--gapr:34px} }
@media(min-width:600px) and (max-width:767px){  :root{--gut:22px;--cols:3;--gapc:16px;--gapr:36px} }
@media(min-width:768px) and (max-width:1023px){ :root{--gut:28px;--cols:3;--gapc:20px;--gapr:42px} }
@media(min-width:1024px) and (max-width:1279px){:root{--gut:32px;--cols:4;--gapc:22px;--gapr:46px} }
@media(min-width:1600px){ :root{--gut:44px;--cols:6;--gapc:26px;--gapr:54px} }

/* One measure, centred, with the hairlines still running the full width:
   the rule is structure and belongs to the window, the content does not. */
.mast,.nav,.applied,main,.panel,footer,.qvtop{
  padding-inline:max(var(--gut), calc((100% - var(--maxw))/2))}

/* ─────────── type, by reading distance ───────────
   The micro-type here is uppercase Latin, which stays legible small. Hangul
   does not, and the card's own text is Hangul: size it on its own terms. */
@media(max-width:767px){
  h3.t{font-size:13.5px}
  .p{font-size:12.5px}
  .sub{font-size:11.5px;letter-spacing:.03em}
  .dist{font-size:11px;line-height:1.85}
  .opt{font-size:12.5px}
  .colo p{font-size:12px}
}
@media(min-width:1280px){
  h3.t{font-size:15px}
  .p{font-size:13px}
}

/* ─────────── phone ─────────── */
@media(max-width:767px){
  :root{--barh:90px}
  body{font-size:12.5px}
  /* the masthead was eating 298px — 35% of the screen — before the first
     photo. Trimmed to about 175px; the tally moved out entirely, it wrapped
     to two lines and broke mid-word. */
  .mast{padding:22px var(--gut) 16px}
  .mast .kicker{margin-bottom:12px;font-size:9px}
  .wm{font-size:10px;letter-spacing:.26em}
  .mast .sub{margin-top:8px;font-size:23px}
  .mast .tally{display:none}
  .head{padding:18px 0 14px}
  .head .h{font-size:15px}
  /* One 48px line could not hold eight category tabs and four controls —
     two and a half tabs were reachable. The tabs get their own line and the
     controls get theirs; 40px more masthead buys back the whole navigation. */
  .nav{flex-wrap:wrap;height:auto;gap:0;align-items:stretch}
  .cats{order:1;flex:1 0 100%;height:48px;gap:17px}
  .qbox{order:2}
  .tools{order:3;flex:1 0 100%;height:42px;gap:0;justify-content:space-between;
    border-top:1px solid var(--hair2)}
  .tools button{flex:0 0 auto}
  .nav.searching .cats{display:none}
  .nav.searching .qbox{order:1;flex:1 0 100%;height:48px}
  /* a 44vw search field could not hold a query; give it the row */
  .qbox.on{width:100%}
  .nav.searching .cats{display:none}
  .panel{padding-top:22px}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 20px}
  .yrow{flex-wrap:wrap;gap:2px;max-width:none}
  .yr{flex:0 0 calc(10% - 2px)}
  .yr .bw{height:24px}
  .dist .yv{margin-right:11px}
  .dist .sep{margin:0 7px}
  .kbd{display:none}
  .qv h2{font-size:18px}
  footer{padding-top:34px;padding-bottom:70px}
}

/* ─────────── tablet and under ─────────── */
/* scoped away from the phone block above, which would otherwise be overridden
   by this one purely because it comes later in the sheet */
@media(min-width:768px) and (max-width:1023px){
  .mast{padding-top:34px;padding-bottom:24px}
  .mast .kicker{margin-bottom:18px}
}
/* shared by phone and tablet */
@media(max-width:1023px){
  /* the tab row scrolls. Fade its edge so a clipped word reads as more to
     come rather than as a broken layout. */
  .cats{mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent);
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent)}
  .cats.end{mask-image:none;-webkit-mask-image:none}
  /* one column below a laptop: side by side, neither half is worth reading */
  .qv{grid-template-columns:1fr;overflow-y:auto}
  .qv .pic{max-height:48vh}
  .qv .pic img{padding:18px}
  .qv .info{border-left:0;border-top:1px solid var(--hair);padding:30px 26px 60px;overflow:visible}
  .qv .cta{padding-top:30px}
}
/* the sticky panel hangs off the bar, and the bar is two rows on a phone */
@media(max-width:767px){ .panel{top:90px;max-height:calc(100vh - 91px)} }
@media(min-width:768px) and (max-width:1023px){
  :root{--barh:48px}
  .nav{height:48px}
  .panel{top:48px;max-height:calc(100vh - 49px)}
}

/* ─────────── touch ───────────
   Nothing here was reachable with a thumb: the smallest target measured
   18px. These only apply where there is no mouse, so the desktop sheet
   keeps its tight rhythm. */
@media(hover:none),(max-width:1023px){
  .cats button{min-height:48px;display:flex;align-items:center}
  .tools button{min-height:44px;display:inline-flex;align-items:center}
  .selwrap select{min-height:44px}
  .opt{min-height:40px;padding:7px 0}
  .yr{min-height:44px;justify-content:flex-end}
  .save{opacity:1;width:44px;height:44px;top:0;right:0}
  .prow button,.qvnav button,.more button,.applied .rst,.tok,.empty .drop button,
  .empty .rst,.qvx,.top{min-height:44px;display:inline-flex;align-items:center}
  .seek a{min-height:40px;display:inline-flex;align-items:center}
  .sizein,.qbox input{min-height:40px}
}

/* ─────────── keyboard ───────────
   There was no visible focus anywhere but the save mark, and the inputs and
   selects had their ring removed outright. A hairline in ink instead of the
   browser's blue, which would be the one saturated thing on the page. Only
   :focus-visible, so a mouse click never draws it.                        */
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.cats button:focus-visible,.tools button:focus-visible{outline-offset:-5px}
.shot:focus-visible{outline:1px solid var(--ink);outline-offset:-1px}
.save:focus-visible{outline-offset:-2px}
.opt:focus-visible,.yr:focus-visible{outline-offset:1px}
h3.t button:focus-visible{outline-offset:2px}
.qbox input:focus-visible,.sizein:focus-visible{outline:0;
  border-bottom-color:var(--ink);box-shadow:0 1px 0 0 var(--ink)}
.selwrap select:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.tok:focus-visible,.prow button:focus-visible,.qvnav button:focus-visible,
.more button:focus-visible,.empty button:focus-visible{outline-offset:2px}

/* ─────────── 찾는 물건 ───────────
   A search the reader keeps. The bar under the navigation only appears when
   one of them has something the reader has not been shown yet.          */
.wbar{display:none;align-items:baseline;flex-wrap:wrap;gap:6px 18px;
  padding-block:12px;padding-inline:max(var(--gut), calc((100% - var(--maxw))/2));
  border-bottom:1px solid var(--hair2);font-size:11px;color:var(--mid)}
.wbar.on{display:flex}
.wbar .lbl{margin-right:2px}
.wbar button{font-size:11px;color:var(--ink);border-bottom:1px solid var(--hair);padding-bottom:1px;
  text-align:left;overflow-wrap:anywhere}
.wbar button:hover{border-bottom-color:var(--ink)}
.wbar b{font-weight:400;margin-left:7px;font-variant-numeric:tabular-nums;color:var(--mid)}
.wbar .wx{font-size:10.5px;color:var(--soft)}
/* a second group in the bar starts on its own line */
.wbar .wbr{flex-basis:100%;height:0}
.wbar .wz{border:0;color:var(--soft);font-size:12px;line-height:1;padding:0 2px}
.wbar .wz:hover{color:var(--ink)}
.watch .wk{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:10px 0 0;font-size:12px}
.watch .wk .c{font-size:10px;color:var(--soft);font-variant-numeric:tabular-nums}
.watch .wk button{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);
  border-bottom:1px solid var(--hair);padding-bottom:2px;white-space:nowrap}
.watch .wk button:hover{color:var(--ink);border-bottom-color:var(--ink)}
.applied .wsv{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid);
  border-bottom:1px solid var(--hair);padding-bottom:2px}
.applied .wsv:hover{color:var(--ink);border-bottom-color:var(--ink)}
.applied .wsv[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.applied .wsv:disabled{color:var(--soft);border-bottom-color:transparent;cursor:default}
.panel .watch{margin-bottom:30px;max-width:680px}
.panel .watch>.lbl{display:block;margin-bottom:8px}
.watch .wr{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid var(--hair2);font-size:12px}
.watch .wo{flex:1;min-width:0;text-align:left;color:var(--mid);overflow-wrap:anywhere}
.watch .wo:hover{color:var(--ink)}
.watch .c{font-size:10px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.watch .nw{font-size:10px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.watch .wd{font-size:12px;line-height:1;color:var(--soft);padding:0 2px}
.watch .wd:hover{color:var(--ink)}
.watch p,.mysz p,.snote{margin:10px 0 0;font-size:10.5px;color:var(--soft);line-height:1.6;font-weight:400}
.head{gap:4px 16px}
.head .hn{margin-left:12px;font-family:'Inter','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  font-size:10.5px;letter-spacing:.06em;color:var(--mid);font-variant-numeric:tabular-nums}

/* ─────────── 내 사이즈 ─────────── */
.mytog{display:inline-block;margin-top:14px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mid);border-bottom:1px solid var(--hair);padding-bottom:2px}
.mytog:hover,.mytog[aria-expanded="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.mysz{grid-column:1/-1}
.mysz[hidden]{display:none}
.mysz>.lbl{display:block;margin-bottom:6px}
.mysz .row{display:flex;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--hair2)}
.mysz .row>span{flex:0 0 92px;font-size:9.5px;letter-spacing:.16em;color:var(--soft)}
.mysz .chips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px}
.szc{font-size:11px;color:var(--mid);border:1px solid var(--hair);padding:3px 8px;line-height:1.4;
  font-variant-numeric:tabular-nums;transition:.12s}
.szc i{font-style:normal;font-size:9.5px;color:var(--soft);margin-left:5px}
.szc:hover{color:var(--ink);border-color:var(--line)}
.szc[aria-pressed="true"]{color:var(--paper);background:var(--ink);border-color:var(--ink)}
.szc[aria-pressed="true"] i{color:var(--hair)}

/* ─────────── 목록 보기 ───────────
   The same card, laid out as a row: nothing in it is dropped, so the save
   mark, the keyboard walk and the detail view work unchanged. */
.grid.list{grid-template-columns:minmax(0,1fr);gap:0;border-top:1px solid var(--hair2)}
.grid.list article{flex-direction:row;align-items:flex-start;gap:16px;padding:12px 0;
  border-bottom:1px solid var(--hair2)}
.grid.list .shot{flex:0 0 64px;width:64px}
.grid.list .save{top:10px}
.grid.list .cap{flex:1;min-width:0;padding:0 40px 0 0;display:grid;
  grid-template-columns:minmax(0,1fr) auto;column-gap:26px;align-items:baseline}
.grid.list .flags{grid-column:1;margin-bottom:4px;min-height:0}
.grid.list h3.t{grid-column:1;min-height:0;margin:0 0 3px;-webkit-line-clamp:1}
.grid.list .p{grid-column:2;grid-row:1/span 2;text-align:right;white-space:nowrap}
.grid.list .p .alt,.grid.list .p .was{display:block;margin-left:0}
.grid.list .sub{grid-column:1/-1;margin-top:2px}
.grid.list article{scroll-margin-top:calc(var(--barh) + 4px)}

/* ─────────── photos ─────────── */
.qv .pic.multi{grid-template-rows:minmax(0,1fr) auto;place-items:stretch}
.qv .pic.multi>img{min-height:0}
.qv .ths{display:flex;gap:6px;padding:0 34px 22px;overflow-x:auto;scrollbar-width:none}
.qv .ths::-webkit-scrollbar{display:none}
.qv .ths button{flex:0 0 44px;height:55px;opacity:.55;transition:opacity .12s;background:var(--paper)}
/* auto margins centre the strip while it fits and give way when it scrolls */
.qv .ths button:first-child{margin-left:auto}
.qv .ths button:last-child{margin-right:auto}
.qv .ths button:hover,.qv .ths button[aria-current="true"]{opacity:1}
.qv .ths button[aria-current="true"]{outline:1px solid var(--ink);outline-offset:1px}
.qv .ths img{width:100%;height:100%;object-fit:cover;padding:0}
.qv .pic .pn{position:absolute;top:14px;right:18px;font-size:9.5px;letter-spacing:.16em;color:var(--soft)}

@media(max-width:767px){
  .grid.list article{gap:12px;padding:11px 0}
  .grid.list .shot{flex-basis:56px;width:56px}
  .grid.list .cap{grid-template-columns:minmax(0,1fr);padding-right:34px}
  .grid.list h3.t{-webkit-line-clamp:2;font-size:13px}
  .grid.list .p{grid-column:1;grid-row:auto;text-align:left;white-space:normal}
  .grid.list .p .alt,.grid.list .p .was{display:inline;margin-left:7px}
  .mysz .row{flex-direction:column;gap:7px}
  /* on a phone the note under a kept search's name gets its own line */
  .head .hn{display:block;margin:5px 0 0}
  .head .hn:empty{display:none}
  .mysz .row>span{flex:none}
  .qv .ths{padding:0 18px 14px}
}
/* one column below a laptop: the photo box has no height of its own, and a
   strip under it left the photo a sliver. Given one, the photo takes the rest. */
@media(max-width:1023px){ .qv .pic.multi{height:min(60vh,640px);max-height:none} }
@media(hover:none),(max-width:1023px){
  .szc{min-height:36px;display:inline-flex;align-items:center}
  .mytog,.applied .wsv,.wbar button,.watch .wo,.watch .wd,.watch .wk button{min-height:40px;display:inline-flex;align-items:center}
  .grid.list .save{top:0}
  .qv .ths button{flex-basis:48px;height:60px}
}

.sub .mc,.qv .kv .mc{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;color:var(--mid)}
.qv .kv .mc{font-size:12px;color:var(--ink)}
/* the underline hugs the words whatever height a touch target gives the box */
.qv .kv .code{margin-left:12px;font-size:10.5px;letter-spacing:.06em;color:var(--mid);
  text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;text-decoration-thickness:1px}
.qv .kv .code:hover{color:var(--ink);text-decoration-color:var(--ink)}
.dist,.qv .kv dd,.qv .hist>div,.seek .qq{font-variant-numeric:tabular-nums}
.tok,.prow button,.more button,.applied .rst,.qvnav button,.qv .cta a,.qv .cta button,.top,.kbd,
.cats button,.tools button,.tools label,.selwrap select,.qvx,.wsv,.mytog{font-family:var(--mono);letter-spacing:.04em}
/* thirty-odd seasons do not wrap into a phone's width; they run in one row
   that scrolls, each bar still a 30px target, the edge fading while there is more */
@media(max-width:767px){
  .yrow{flex-wrap:nowrap;overflow-x:auto;gap:2px;scrollbar-width:none;padding-bottom:2px;
    mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 24px),transparent);
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 24px),transparent)}
  .yrow::-webkit-scrollbar{display:none}
  .yr{flex:0 0 30px}
  .yr .bw{height:36px}
}
@media(hover:none),(max-width:1023px){ .qv .kv .code{min-height:40px;display:inline-flex;align-items:center} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;scroll-behavior:auto!important} }

<header class="mast">
  <div class="kicker" id="kicker">—</div>

  <div class="tally" id="tally"></div>
</header>

<div class="navwrap">
  <nav class="nav">
    <div class="cats" id="cats"></div>
    <div class="qbox" id="qbox"><input id="q" type="search" placeholder="품목·연도·번호" autocomplete="off" aria-label="검색"></div>
    <div class="tools">

    </div>

</div>

<section class="panel" id="panel" hidden>

<div class="wbar" id="kbar" role="status" aria-live="polite"></div>
<div class="wbar" id="wbar" role="status" aria-live="polite"></div>

    <!-- pressing a filter changed the page and announced nothing -->

<footer><div class="colo" id="colo"></div><div class="sig" id="sig"></div></footer>

  <div class="qvtop">
    <span class="lbl" id="qvpos"></span>

<button class="top" id="top">맨 위로</button>

<script>

function oneSize(p,bottoms){
  var m;
  if(LETTERS.indexOf(p)>=0) return p;
  if(/^(?:ONE SIZE|ONESIZE|OS|FREE|F)$/.test(p)) return 'ONE SIZE';
  if((m=/^(?:IT|EU)\s*(\d{1,2}(?:\.5)?)$/.exec(p)) || (m=/^(\d{1,2}(?:\.5)?)\s*(?:IT|EU)$/.exec(p))) return m[1];
  if((m=/^(US|UK|FR|JP)\s*(\d{1,2}(?:\.5)?)$/.exec(p))) return m[1]+' '+m[2];
  if((m=/^(\d{1,2}(?:\.5)?)\s*(US|UK|FR|JP)$/.exec(p))) return m[2]+' '+m[1];
  if((m=/^(\d{2})\s*[SRL]$/.exec(p))) return m[1];
  if(bottoms){
    if((m=/^W\s*(\d{2})(?:\s*L\s*\d{2})?$/.exec(p)) || (m=/^(\d{2})\s*(?:[X×]\s*)?\d{2}$/.exec(p))) return m[1];
  }
  return p;
}
function sizeToks(it){
  var z=it.z; if(!z) return [];
  z=String(z); try{ z=z.normalize('NFKC') }catch(e){}
  z=z.toUpperCase().replace(/\s+/g,' ').trim().replace(/\s*INTERNATIONAL$/,'');
  var bottoms = SZGRP[it.s]==='bot' || it.s==='기타', out=[];
  z.split(/\s*\/\s*/).forEach(function(p){ if(!p) return; var t=oneSize(p,bottoms); if(t && out.indexOf(t)<0) out.push(t) });
  return out;
}

  if(!pick || !pick.length) return false;
  for(var i=0;i<toks.length;i++) if(pick.indexOf(toks[i])>=0) return true;
  return false;
}
function sizeOrder(a,b){
  var la=LETTERS.indexOf(a), lb=LETTERS.indexOf(b);
  if(la>=0||lb>=0) return la<0?1:lb<0?-1:la-lb;
  var na=/^\d/.test(a), nb=/^\d/.test(b);
  if(na&&nb) return parseFloat(a)-parseFloat(b);
  if(na!==nb) return na?-1:1;
  var sa=a.split(' '), sb=b.split(' ');
  if(sa[0]!==sb[0]) return sa[0]<sb[0]?-1:1;
  return (parseFloat(sa[1])||0)-(parseFloat(sb[1])||0);
}

/* A saved listing keeps what the reader last saw of it: the price in the
   seller's own money when there is one, so a move in the exchange rate is
   never taken for the seller cutting the price. Older saves held just 1;
   they are given the price as it stands the first time this page opens. */
function keepMark(it){ return {k:it.k||0, p:it.p||0, u:curOf(it.u), d:TODAY||'', g:it.x?1:0} }
function curOf(u){ return u && u!=='KRW' ? String(u) : '' }
function savedChange(it){
  var b=saved[it.l]; if(!b || typeof b!=='object') return null;
  if(it.x) return b.g ? null : {gone:true};
  // a price in another currency than the one saved cannot be compared at all
  var cu=curOf(it.u); if(curOf(b.u)!==cu) return null;
  var was=cu?b.p:b.k, cur=cu?it.p:it.k;
  if(!(was>0) || !(cur>0)) return null;
  return cur<was ? {drop:true, was:was, cur:cur, u:cu} : null;
}
// what the reader has now seen of it, up or down, becomes the new baseline
function ackSaved(it){
  var b=saved[it.l]; if(!b) return false;
  var m=keepMark(it);
  if(typeof b==='object' && b.k===m.k && b.p===m.p && curOf(b.u)===m.u && !!b.g===!!m.g) return false;
  saved[it.l]=m; persist(); return true;
}

/* ── time ──────────────────────────────────────────────
   f  = first date this listing was seen by the sweep
   ls = last date it was seen (only on ones that have since vanished)
   h  = [[date, krw], …] price points, recorded only when the price moved
   x  = 1 when it is no longer in the sweep

   observation window, and nothing more.                                     */
var TODAY=null;
function dnum(s){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); 
  return m? Date.UTC(+m[1],+m[2]-1,+m[3])/86400000 : null }
function daysBetween(a,b){ var x=dnum(a),y=dnum(b); return (x==null||y==null)?null:y-x }
function seenDays(it){                 // how long we have been watching it
  var end = it.x&&it.ls ? it.ls : TODAY;
  var n = daysBetween(it.f,end);
  return n==null?null:n+1;
}
function seenText(it){
  var n=seenDays(it); if(n==null) return '';
  if(it.x) return n<2 ? '1일간 보임' : won(n)+'일간 보임';
  return n<2 ? '' : won(n)+'일째';
}

/* ── since the last visit ──────────────────────────────────────────────

   they need everything that arrived while they were away. Kept in this
   browser only: the date of the build they saw last. A second visit on the
   same day keeps the same baseline, so a reload does not wipe the mark.  */
var SINCE=null;
function initSince(today){
  if(!today) return;
  var st=null; try{ st=JSON.parse(localStorage.getItem('ccpx.visit')||'null') }catch(e){}
  // an older build opened after a newer one (a cached copy, a saved file):
  // leave the newer baseline alone and mark nothing
  if(st && st.date && st.date>today) return;

/* ── how fresh each source is ──────────────────────────────────────────
   last = the latest date a listing from this source was first seen by the
   sweep; START = the first sweep on record. A source whose newest listing is
   from the first sweep has sent nothing new since — which may be a quiet
   shop or a collector that has stopped; the page says what it saw and no
   more. When the pipeline sends sources[].seen (the last day that source
   answered at all), that is said too.                                    */
var SRCSTAT={}, START=null, MCOUNT={};
function buildSrcStat(){
  SRCSTAT={}; START=null;
  for(var i=0;i<D.items.length;i++){ var it=D.items[i];
    if(it.f && (!START || it.f<START)) START=it.f;
    // a sale record is not a listing; a listing that has since gone was still
    // new on the day it came in
    if(it.so) continue;
    var s=SRCSTAT[it.r]||(SRCSTAT[it.r]={n:0,last:null,seen:null});
    if(!it.x) s.n++;
    if(it.f && (!s.last || it.f>s.last)) s.last=it.f;
  }
  (D.sources||[]).forEach(function(x){
    if(x && x.name && SRCSTAT[x.name] && /^\d{4}-\d{2}-\d{2}$/.test(x.seen||'')){ SRCSTAT[x.name].seen=x.seen; SRCSTAT[x.name].lag=Math.max(0,x.lag|0) } });
}
// nothing new for three builds' worth of days is worth saying; one quiet day is not
function srcOrder(){ return Object.keys(SRCSTAT).sort(function(a,b){ return SRCSTAT[b].n-SRCSTAT[a].n }) }
function srcStale(r){
  var s=SRCSTAT[r]; if(!s || !s.last || !TODAY) return false;
  var d=daysBetween(s.last,TODAY); return d!=null && d>=3;
}
// a source read ahead of the build (lag: Grailed on the PC the morning before) is late by design
function srcStopped(r){ var s=SRCSTAT[r]; if(!(s && s.seen && TODAY && s.seen<TODAY)) return false; var d=daysBetween(s.seen,TODAY); return d==null || d>(s.lag||0) }
function srcFresh(r){
  var s=SRCSTAT[r]; if(!s) return '';
  var p=[];
  if(srcStopped(r)) p.push(md(s.seen)+' 이후 수집 안 됨');
  else if(srcStale(r)) p.push(md(s.last)+' 이후 신규 없음');
  else if(s.last) p.push('최근 신규 '+md(s.last));
  return p.join(' · ');
}

/* ── customs ────────────────────────────────────────────────────────────

     list and are not taxed; 물품가격 includes the tax, inland freight and
     insurance inside the sending country, and leaves out international

var DOMESTIC={'번개장터':1,'후루츠패밀리':1};
function usdOf(it){

  return '<dt>통관</dt><dd>'+amt+' · '+say+' <span class="basis">'+why+'</span></dd>';

    if(y2>y1 && y2<=MAXY && !season){ got={k:'rng', v:e+'–'+b}; at=st; len=m[0].length-(st-m.index) }
  }

/* ── search ────────────────────────────────────────────
   Tokenised and order-independent: "jacket bondage" has to find what

var QT=[], QX=[];

  QX=QT.map(alts);

  return 0;
}

  if(!QT.length) return 0;

    var best=hit(it,QT[i]), a=QX[i];
    for(var j=1;j<a.length;j++){ var tp=it.__t.indexOf(a[j]); if(tp>=0){ var h=tp===0?70:50; if(h>best) best=h } }
    if(!best) return 0;            // every token has to land somewhere
    total+=best;

    if(best>=50) f['상품명']=1;

/* ── filter + sort ── */
var GROUPS=['y','cat','price','src','cert','motif','mark','flag','size','q'];
/* The flag group is the one that AND-s inside itself: picking 신규 and
   여러 곳 등록 means both, where picking two motifs means either. Kept as one
   predicate so the facet count and the click that follows it cannot drift. */
var FLAGV=['new','drop','multi','saved','gone','since','sold','mine'];
function flagPass(it,fl){
  if(!fl.gone && it.x) return false;          // vanished ones are opt-in
  if(fl.gone && !it.x) return false;
  if(!fl.sold && it.so) return false;         // and so are sale records
  if(fl.sold && !it.so) return false;
  if(fl.since && !(SINCE && it.f && it.f>SINCE)) return false;
  if(fl['new'] && !it.n) return false;
  if(fl.drop && !(it.w&&it.w>it.k)) return false;
  if(fl.saved && !saved[it.l]) return false;
  if(fl.multi && !(it.g>1)) return false;
  if(fl.mine && !mineMatch(it)) return false;
  return true;
}
function passes(g,it){
  switch(g){
    case 'y':     return !any(F.y)   || !!F.y[it.__yk];
    case 'cat':   return !any(F.cat) || !!F.cat[it.s];
    case 'price': return !any(F.price)|| !!F.price[priceBand(it.k)];
    case 'src':   return !any(F.src) || !!F.src[it.r];
    case 'cert':  return !any(F.cert)|| !!F.cert[it.__c];
    case 'motif':
      if(!any(F.motif)) return true;
      for(var i=0;i<it.__m.length;i++) if(F.motif[it.__m[i]]) return true;
      return false;
    case 'mark':
      if(!any(F.mark)) return true;
      for(var j=0;j<it.__mk.length;j++) if(F.mark[it.__mk[j]]) return true;
      return false;
    case 'flag':  return flagPass(it,F.flag);
    case 'size':  return !F.size || (!!it.z && it.z.toLowerCase().indexOf(F.size)>=0);
    case 'q':     return !QT.length || score(it)>0;
  }
  return true;
}
function match(it){
  for(var i=0;i<GROUPS.length;i++) if(!passes(GROUPS[i],it)) return false;
  return true;
}
function sortView(){
  var s=$('sort').value;
  if(s==='rel' && !QT.length) s='k-';
  view.sort(function(a,b){
    if(s==='rel') return score(b)-score(a)||b.k-a.k;
    if(s==='k-') return b.k-a.k;
    if(s==='k+') return a.k-b.k;
    if(s==='y+') return (a.__y||9999)-(b.__y||9999)||b.k-a.k;
    if(s==='y-') return (b.__y||0)-(a.__y||0)||b.k-a.k;
    if(s==='drop') return ((b.w?b.w-b.k:0)-(a.w?a.w-a.k:0))||b.k-a.k;
    if(s==='age') return ((seenDays(b)||0)-(seenDays(a)||0))||b.k-a.k;
    // this build's new ones, then whatever the sweep saw first most recently —
    // so a search opened after a few days away leads with what came in meanwhile
    return (b.n||0)-(a.n||0)||(a.f===b.f?0:(b.f||'')>(a.f||'')?1:-1)||b.k-a.k;
  });
  for(var i=0;i<view.length;i++) view[i].__v=i;
}

/* ── photo sizes ───────────────────────────────────────────────────────
   The sweep records whatever URL the listing gives, which is the full-size
   photo. A card draws it at 173–285px and was pulling 181KB for it; the
   first screen came to 2.4MB. Each host was tested by hand for what it
   actually answers to (2026-09-22):

     Grailed   ?w=600         181KB -> 10.6KB
     Shopify   &width=600      44KB -> 10.1KB
     eBay      s-l140 is 105x140, too soft on any recent phone — s-l400
               costs more and is the one case where the right call is to
               spend bytes rather than save them
     Depop     ignores every form tried; left alone
     Vestiaire refuses a plain request either way; asked smaller regardless

   A CDN can stop honouring any of this without telling us, so the element
   carries the original and falls back to it on error before giving up. */
function thumb(u,w){
  if(!u) return u;
  try{
    if(u.indexOf('media-assets.grailed.com')>=0) return u+(u.indexOf('?')<0?'?':'&')+'w='+w;
    if(u.indexOf('cdn.shopify.com')>=0)          return u+(u.indexOf('?')<0?'?':'&')+'width='+w;
    if(u.indexOf('i.ebayimg.com')>=0)            return u.replace(/\/s-l\d+\.(jpg|png|webp)/i,
      '/s-l'+(w<=160?225:w<=400?400:w<=800?500:1600)+'.$1');
    if(u.indexOf('images.vestiairecollective.com')>=0) return u.replace(/\bw=\d+/, 'w='+w);
    // Mercari's list thumbnail is 240 px; the same photo at full size lives under /item/detail/orig/photos/
    if(u.indexOf('static.mercdn.net/thumb/item/')>=0 && w>=600) return u.replace(/\/thumb\/item\/webp\/(m\d+_\d+)\.jpg/, '/item/detail/orig/photos/$1.jpg');
    // Rakuma keeps a medium (m) and a large (l) copy of every photo; the large one only for the detail view
    if(u.indexOf('img.fril.jp/img/')>=0 && w>=1000) return u.replace(/\/m\/(\d+\.jpg)/, '/l/$1');
    // Yahoo's picture proxy (야후옥션 · 야후 플리마) scales to the w/h asked for: 300 · 600 · 1200, no square padding
    if(u.indexOf('auc-pctr.c.yimg.jp/')>=0){ var W=w<=300?300:w<=600?600:1200;
      return u.replace(/([?&])w=\d+/,'$1w='+W).replace(/([?&])h=\d+/,'$1h='+W).replace(/&(?:ccw|cch)=\d+/g,'').replace(/&fill=1\b/,'') }
  }catch(e){}
  return u;
}
function imgTag(u,w,extra){
  if(!u) return '';
  var t=thumb(u,w);
  return '<img loading="lazy" decoding="async" src="'+esc(t)+'"'+
    (t!==u?' data-full="'+esc(u)+'"':'')+' alt=""'+(extra||'')+'>';
}
/* ── more than one photo ────────────────────────────────────────────────
   im = every photo the listing carries, in the seller's order, when the sweep
   collects them; i stays the first. Until a source sends im the detail view
   shows the one photo it always has.                                      */
function photosOf(it){
  var a=[];
  if(it.i) a.push(it.i);
  if(Array.isArray(it.im)) it.im.forEach(function(u){
    if(typeof u==='string' && /^https?:\/\//.test(u) && a.indexOf(u)<0) a.push(u) });
  return a.slice(0,12);
}
function showPhoto(k){

  var im=$('qvimg'); if(!im) return;

  if(t!==u) im.setAttribute('data-full',u); else im.removeAttribute('data-full');

function bindImgs(root){
  var ims=root.querySelectorAll('.shot img:not([data-b])');
  for(var i=0;i<ims.length;i++){(function(im){
    im.setAttribute('data-b','1');
    if(im.complete&&im.naturalWidth>0){im.classList.add('on');return}
    im.addEventListener('load',function(){im.classList.add('on')});
    im.addEventListener('error',function(){
      // one retry at the size the listing gave us, then we admit there is
      // no photo rather than leaving a broken element behind
      var full=im.getAttribute('data-full');
      if(full && im.src!==full){ im.removeAttribute('data-full'); im.src=full; return }
      var p=im.parentNode; im.remove(); p.classList.add('dead');
    });

}

/* ── 찾는 물건: reading and keeping ── */
// the conditions alone, in one spelling: two clicks in another order are the
// same search, and the sort is how it is read, not what it finds
function filterQs(){
  var p=[];
  FG.forEach(function(g){
    var k=keys(F[g]).filter(function(v){ return !(g==='flag' && v==='since') }); if(!k.length) return;
    var vals = g==='y' ? packYears(k) : k.map(function(v){return slugFor(g,v)}).sort();
    p.push(PARAM[g]+'='+vals.map(encodeURIComponent).join(','));
  });
  if(F.size) p.push('size='+encodeURIComponent(F.size));
  if(F.q && QT.length) p.push('q='+encodeURIComponent(F.q));
  return p.join('&');
}
function stateLabel(){
  var p=[];
  keys(F.cat).forEach(function(v){ p.push(v) });
  var ys=keys(F.y); if(ys.length) p.push(packYears(ys).map(function(y){ return y==='none'?'연도 미표기':y }).join(', '));
  ['motif','price','src','cert','mark','flag'].forEach(function(g){ keys(F[g]).forEach(function(v){
    if(!(g==='flag'&&v==='since')) p.push(tokLabel(g,v)) }) });
  if(F.size) p.push('사이즈 '+F.size);
  if(F.q && QT.length) p.push('“'+F.q+'”');
  var s=p.join(' · ');
  return s.length>60 ? s.slice(0,58)+'…' : s;
}
// the other searches are read with the same code as the page's own, by
// lending them the filter state for the length of one count
function withState(st,fn){
  var kF=F, kQ=F.q, kT=QT, kX=QX;
  F={y:st.g.y,cat:st.g.cat,motif:st.g.motif,price:st.g.price,src:st.g.src,cert:st.g.cert,
     mark:st.g.mark,flag:st.g.flag,size:st.size,q:''};
  try{ setQuery(st.q); return fn() }
  finally{ F=kF; F.q=kQ; QT=kT; QX=kX }
}
function watchCounts(){
  if(WCNT) return WCNT;
  WCNT=WATCH.map(function(w){
    var st=parseQs(w.qs);
    // it asks for the reader's sizes and none are kept: there is nothing to
    // count it by, and announcing the whole archive under its name would lie
    if(st.g.flag.mine && !mineAny()) return {n:0, nw:0, needSize:true};
    return withState(st,function(){
      var n=0, nw=0;
      for(var i=0;i<D.items.length;i++){ var it=D.items[i];
        if(!match(it)) continue; n++;
        if(w.seen && it.f && it.f>w.seen && !it.x && !it.so) nw++ }
      return {n:n, nw:nw};
    });
  });

}
function touchWatch(i){

}
function toggleWatch(){
  var fq=filterQs(); if(!fq) return;

  else if(WATCH.length<WMAX) WATCH.unshift({qs:fq, label:stateLabel(), seen:TODAY, at:TODAY});
  WNEW=null; persistWatch();
  var cat=keys(F.cat), wj=watchAt(fq);
  $('hlabel').textContent = wj>=0 ? WATCH[wj].label : cat.length===1?cat[0] : (F.flag.saved?'저장함':'전체');
  $('hnote').textContent = wj>=0 ? '저장한 검색' : '';
  buildApplied(); buildWatch();
  var b=$('wsv'); if(b) try{ b.focus({preventScroll:true}) }catch(e){}
}
function buildWatch(){
  var cs=watchCounts(), fq=filterQs(), bar='', list='', fresh=0;
  WATCH.forEach(function(w,i){
    var c=cs[i]||{n:0,nw:0};
    list+='<div class="wr"><button class="wo" data-wopen="'+i+'">'+esc(w.label)+'</button>'+
      (c.needSize?'<span class="c">사이즈 설정 필요</span>':'<span class="c">'+won(c.n)+'건</span>')+
      (c.nw?'<span class="nw">신규 '+won(c.nw)+'</span>':'')+
      '<button class="wd" data-wdel="'+i+'" aria-label="'+esc(w.label)+' 삭제">×</button></div>';
    if(c.nw && w.qs!==fq){ fresh++;
      if(fresh<=4) bar+='<button data-wopen="'+i+'">'+esc(w.label)+'<b>신규 '+won(c.nw)+'</b></button>' }
  });
  if(fresh>4) bar+='<span class="wx">외 '+won(fresh-4)+'개</span>';
  // saved listings whose price fell, or that left the list, since last seen
  var ch=[], nsaved=0;
  for(var si=0;si<D.items.length;si++){ var sit=D.items[si]; if(!saved[sit.l]) continue;
    if(!sit.so) nsaved++;
    var c2=savedChange(sit); if(c2) ch.push([sit,c2]) }
  ch.sort(function(a,b){ return (b[1].gone?2:(b[1].was-b[1].cur)/b[1].was)-(a[1].gone?2:(a[1].was-a[1].cur)/a[1].was) });
  var kb='';

function openWatch(i){

// One quiet line of what the current slice actually contains — the research
// readout. No separate page, no mode: it just describes what is on screen.
function buildDist(){
  var el=$('dist');
  var narrowed = any(F.y)||any(F.motif)||any(F.cat)||any(F.cert)||any(F.src)||any(F.mark)||
                 any(F.price)||QT.length||F.size||F.flag.saved||F.flag.multi||F.flag.mine;
  if(!narrowed || view.length<2){ el.hidden=true; el.innerHTML=''; return }
  var lo=9999,hi=0,dated=0,sec={},yc={},i,it;
  for(i=0;i<view.length;i++){
    it=view[i];
    if(it.__y){ dated++; yc[it.__y]=(yc[it.__y]||0)+1; if(it.__y<lo)lo=it.__y; if(it.__y>hi)hi=it.__y }
    sec[it.s]=(sec[it.s]||0)+1;
  }
  var rows=[];
  if(dated){
    var ys=Object.keys(yc).map(Number).sort(function(a,b){return a-b});
    var line='<b>'+(lo===hi?lo:lo+'—'+hi)+'</b>';
    // the year shape of THIS slice, in order, so a pattern is visible at a glance
    if(ys.length>1) line+='<span class="sep">·</span>'+ys.map(function(y){
      return '<span class="yv">'+y+' <span class="q">'+won(yc[y])+'</span></span>' }).join('');
    if(dated<view.length) line+='<span class="sep">·</span><span class="q">연도 미표기 '+won(view.length-dated)+'</span>';
    rows.push(line);
  }
  var order=CATORDER.filter(function(c){return sec[c]});
  if(order.length>1) rows.push(order.map(function(c){
    return '<span class="yv">'+esc(c)+' <span class="q">'+won(sec[c])+'</span></span>' }).join(''));

  // Which motifs keep turning up on the same garment as the one being looked at.
  // Only when exactly one motif is selected — with two or more the question is
  // no longer "what goes with this".
  var mk=keys(F.motif);
  if(mk.length===1){
    var co={},j;
    for(i=0;i<view.length;i++){ var mm=view[i].__m;
      for(j=0;j<mm.length;j++) if(mm[j]!==mk[0]) co[mm[j]]=(co[mm[j]]||0)+1 }
    var cl=Object.keys(co).sort(function(a,b){return co[b]-co[a]});
    if(cl.length) rows.push('<span class="lead">함께 나온 기법·모델</span>'+cl.map(function(k){
      return '<span class="yv">'+esc(motifLbl(k))+' <span class="q">'+won(co[k])+'</span></span>' }).join(''));
  }
  // what the offers on screen cost: every listing of a model is an offer of its
  // own, so a card that stands for three shops brings three prices
  var ks=[];
  for(i=0;i<view.length;i++){ it=view[i];
    if(it.v && it.v.length) it.v.forEach(function(v){ if(v.k>0 && offerPasses(it,v)) ks.push(v.k) });
    else if(it.k>0) ks.push(it.k) }
  if(ks.length>=3){
    ks.sort(function(a,b){return a-b});
    rows.push('<span class="lead">'+(F.flag.sold?'판매 기록':'가격')+'</span><b>₩'+won(ks[0])+'—₩'+won(ks[ks.length-1])+'</b>'+
      '<span class="sep">·</span>중앙값 <b>₩'+won(medianOf(ks))+'</b>');
  }
  // and what the same conditions sold for, where sale records exist
  if(!F.flag.sold){
    var tf={}, kf; for(kf in F.flag) if(own.call(F.flag,kf)&&F.flag[kf]) tf[kf]=1;
    delete tf.gone; tf.sold=1;
    var sk=[];
    for(i=0;i<D.items.length;i++){ it=D.items[i]; if(!it.so || !(it.k>0)) continue;
      var ok=true;
      for(var gi=0;gi<GROUPS.length;gi++){ var gg=GROUPS[gi];
        if(gg==='flag' ? !flagPass(it,tf) : !passes(gg,it)){ ok=false; break } }
      if(ok) sk.push(it.k) }
    if(sk.length>=2){ sk.sort(function(a,b){return a-b});
      rows.push('<span class="lead">판매 기록</span>중앙값 <b>₩'+won(medianOf(sk))+'</b><span class="sep">·</span>'+won(sk.length)+'건') }
  }
  if(!rows.length){ el.hidden=true; el.innerHTML=''; return }
  el.innerHTML=rows.map(function(x){return '<div>'+x+'</div>'}).join('');
  el.hidden=false;
}
// another shop's listing of the same model shares its year, kind and model
// words, but not its price, shop or size — those filters are asked again
function offerPasses(it,v){
  if(any(F.price) && !F.price[priceBand(v.k)]) return false;
  if(any(F.src) && !F.src[v.r]) return false;
  if(F.size && !(v.z && String(v.z).toLowerCase().indexOf(F.size)>=0)) return false;
  if(F.flag.mine){ var o={z:v.z, s:it.s}; o.__z=sizeToks(o); if(!mineMatch(o)) return false }
  return true;
}
function medianOf(a){ var m=a.length>>1; return a.length%2 ? a[m] : Math.round((a[m-1]+a[m])/2) }

// Price moves, oldest first. Only real recorded points — no interpolation.
/* A price point is [date, krw, sellerPrice?]. The movement is read off the
   seller's own number when we have it, because the won figure also moves with
   the exchange rate: on 2026-09-22 a seller cut ¥3,413,000 to ¥3,349,000, a
   1.9% drop, and the won view called it '오름 8,725 · 0%'. The rows still lead
   with won, the way the cards do, with the seller's price beside it. */
function histHtml(it){
  if(!it.h||it.h.length<2) return '';
  var cur=it.u||'', sym=cur&&cur!=='KRW'?(SYM[cur]||cur+' '):'';
  var nat=function(pt){ return pt.length>2 && pt[2]>0 ? pt[2] : null };
  var haveNat=it.h.every(function(pt){ return nat(pt)!=null });
  // For a listing priced in another currency, the won figure alone cannot say
  // whether the seller moved: the rate moves it too. Points recorded before
  // the seller's price was kept carry only won, and for those we show the
  // dates and what we converted, and say nothing about direction.
  var krwIsSeller = !cur || cur==='KRW';
  var canJudge = haveNat || krwIsSeller;
  var rows=it.h.map(function(pt,i){
    var d=pt[0], v=pt[1], p=nat(pt);
    var pv=i>0?it.h[i-1]:null;
    // compare like with like: seller's number if both ends have one
    var a = haveNat&&pv ? nat(pv) : (pv?pv[1]:null);
    var b = haveNat ? p : v;
    var delta='';
    if(canJudge && a!=null && b!==a) delta='<em class="'+(b<a?'dn':'up')+'">'+
      (b<a?'−':'+')+(haveNat?sym+Number(Math.abs(b-a)).toLocaleString('en-US'):won(Math.abs(b-a)))+'</em>';
    var alt = (haveNat && sym) ? '<span class="alt">'+sym+Number(p).toLocaleString('en-US')+'</span>' : '';
    return '<div><span>'+esc(d)+'</span><b>₩'+won(v)+alt+delta+'</b></div>';
  }).join('');
  var f0=it.h[0], l0=it.h[it.h.length-1];
  var first = haveNat ? nat(f0) : f0[1], last = haveNat ? nat(l0) : l0[1];
  var net='';
  if(!canJudge){
    net='<div class="net">원화 환산가만 기록됨</div>';
  } else if(first!==last && first>0){
    var amt = haveNat ? sym+Number(Math.abs(last-first)).toLocaleString('en-US') : won(Math.abs(last-first));
    net='<div class="net">'+(last<first?'내림 ':'오름 ')+amt+' · '+
      (Math.abs(last-first)/first*100).toFixed(1).replace(/\.0$/,'')+'%</div>';
  }
  return '<div class="hist"><span class="lbl">가격 변동</span>'+rows+net+'</div>';
}

/* ── panel builders ── */
// Facet counts describe the CURRENT slice, not the whole archive. For each
// group we count the items that satisfy every OTHER condition — so a number
// is "how many of these are in what I am looking at", and the options stay
// switchable. The groups OR inside themselves, so picking a second value in a
// group you have already used WIDENS the result rather than landing on it —
// and for 모티프, where one listing can carry several, the two sets overlap,
// so the total comes out below the sum of the two numbers.
// One pass: an item failing 0 groups counts everywhere, failing exactly 1 counts
// only there, failing 2+ counts nowhere.
var FACET={};
var TRIAL={};
function buildFacets(){
  var G=['y','cat','price','src','cert','motif','mark','flag'];
  var f={}; G.forEach(function(g){f[g]={}});
  // Flags AND each other, so each one is counted against the selection it
  // describes: for an unpressed flag that is the selection plus it — what
  // pressing would give — and for a pressed one it is the selection as it
  // stands, which is the slice on screen. Toggling it off here instead
  // printed the complement: 사라진 매물 read 4,336 under a header saying 300.
  TRIAL={};
  for(var t=0;t<FLAGV.length;t++){
    var v=FLAGV[t], trial={}, kk;
    for(kk in F.flag) if(own.call(F.flag,kk)&&F.flag[kk]) trial[kk]=1;
    trial[v]=1;
    TRIAL[v]=trial;
  }

/* ── url state ──────────────────────────────────────────
   Readable query params, so a link says what it shows and can be hand-edited:

   one filter instead of leaving the page. Falls back silently on file://,
   where the History API throws.                                          */
var urlLock=false, histOK=true;

/* ── one address per listing ───────────────────────────────────────────
   Every collection catalogue worth the name gives each object its own
   address — the Rijksmuseum, the V&A. This one gave none: opening a listing
   changed nothing in the bar, so it could not be sent to anyone, a reload
   lost it, and on a phone the back gesture left the site instead of closing
   the panel.

   The key is a 32-bit FNV-1a of the listing's own URL in base 36 — seven
   characters, stable for as long as the seller's link is, and unique across
   all 4,636 listings as built. Not an index: the order changes every day. */

  return (it.__k=h.toString(36));

function byKey(k){

function stripItem(qs){

function slugFor(g,v){

function unslugFor(g,v){

function packYears(ks){

}
// what would actually be added: repeats in the link counted once, and no more
// searches or sizes than there is room for
function keepNew(k){
  var r={s:0,w:0,z:0}, su={}, sq={}, room=Math.max(0,WMAX-WATCH.length);
  k.s.forEach(function(u){ if(su[u]) return; su[u]=1; if(!saved[u]) r.s++ });
  k.w.forEach(function(x){ if(sq[x.qs]) return; sq[x.qs]=1; if(watchAt(x.qs)<0 && r.w<room) r.w++ });
  ['top','bot','shoe'].forEach(function(g){ var sz={}, n2=0, room2=Math.max(0,40-MYSZ[g].length);
    k.z[g].forEach(function(t){ if(sz[t]) return; sz[t]=1; if(MYSZ[g].indexOf(t)<0 && n2<room2) n2++ }); r.z+=n2 });
  return r;
}
function idxOfUrl(u){ var i=byKey(keyOf({l:u})); return i>=0 && D.items[i].l===u ? i : -1 }
function showKeepBar(){
  var b=$('kbar');
  if(!KEEPIN){ b.innerHTML=''; b.classList.remove('on'); return }
  var r=keepNew(KEEPIN), any1=r.s||r.w||r.z;
  b.innerHTML='<span class="lbl">저장 가져오기</span>'+
    (any1 ? '<span>매물 '+won(r.s)+' · 검색 '+won(r.w)+' · 사이즈 '+won(r.z)+'</span><button id="kyes">가져오기</button>'
          : '<span>추가할 것 없음</span>')+
    '<button id="kno">닫기</button>';
  b.classList.add('on');
}
function importKeep(){
  var k=KEEPIN; if(!k) return;
  // read what is kept here afresh, so adding never writes over a change made
  // since this page loaded (another tab, another window)
  loadSaved(); loadWatch(); loadSize();
  // a listing this issue has gets its price now; one it does not is kept as
  // saved and given its price the day it is seen
  k.s.forEach(function(u){ if(saved[u]) return; var i=idxOfUrl(u); saved[u]= i>=0 ? keepMark(D.items[i]) : 1 });
  k.w.forEach(function(x){ if(watchAt(x.qs)<0 && WATCH.length<WMAX)
    WATCH.push({qs:x.qs, label:x.label, seen:x.seen||TODAY, at:TODAY}) });
  ['top','bot','shoe'].forEach(function(g){ k.z[g].forEach(function(t){
    if(MYSZ[g].indexOf(t)<0 && MYSZ[g].length<40) MYSZ[g].push(t) }) });
  persist(); persistWatch(); persistSize(); WCNT=null; KEEPIN=null;
  $('kbar').innerHTML='<span class="lbl">저장 가져오기</span><span>가져옴</span>';
  setTimeout(function(){ if(!KEEPIN){ $('kbar').innerHTML=''; $('kbar').classList.remove('on') } },2500);
  buildOrder(); buildPanel(); apply(true,false);
}
// the link pasted into a tab that already has the page open arrives as a
// change of the # part, not a new load
window.addEventListener('hashchange',function(){
  var k=null; try{ k=readKeep(location.hash) }catch(e){}
  if(!k || !D) return;
  KEEPIN=k; showKeepBar();
  // pasting added an entry to the history; stepping back over it removes the
  // # part and leaves Back working at once
  try{ history.back() }catch(e){ if(histOK) try{ history.replaceState(null,'',location.pathname+location.search) }catch(e2){} }
});
$('kbar').addEventListener('click',function(e){
  if(e.target.closest('#kyes')){ importKeep(); return }
  if(e.target.closest('#kno')){ KEEPIN=null; showKeepBar() }
});
// not `addEventListener('click', closeQV)`: the click event would arrive as
// the fromPop argument and the address would keep the listing in it
$('qvclose').addEventListener('click',function(){ closeQV() });
$('qvprev').addEventListener('click',function(){stepQV(-1)});
$('qvnext').addEventListener('click',function(){stepQV(1)});
document.addEventListener('keydown',function(e){
  var tag=(e.target.tagName||'').toLowerCase();
  var typing = tag==='input'||tag==='select'||tag==='textarea';
  if(e.key==='Escape'){
    if($('ov').classList.contains('open')) closeQV();
    else if($('panel').classList.contains('on')) $('pdone').click();
    else if(typing) e.target.blur();
    return;
  }
  // Cmd/Ctrl/Alt belong to the browser — Alt+← is Back, Ctrl+F is find. Taking
  // them stepped the open listing to the previous one and rewrote the address
  // while the Back navigation fired underneath, and opened the filter panel on
  // top of the find bar. The one exception is Shift, which Tab needs.
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if($('ov').classList.contains('open')){
    if(e.key==='Tab'){
      var f=qvFocusables(); if(!f.length) return;
      var first=f[0], last=f[f.length-1];
      if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus() }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus() }
      else if(f.indexOf(document.activeElement)<0){ e.preventDefault(); first.focus() }
      return;
    }
    if(typing) return;
    if(e.key==='ArrowLeft') stepQV(-1);
    if(e.key==='ArrowRight') stepQV(1);
    return;
  }
  if(typing) return;
  if(e.key==='/'){ e.preventDefault(); $('qbox').classList.add('on');
    $('qtog').setAttribute('aria-expanded','true');
    var nv=document.querySelector('.nav'); if(nv) nv.classList.add('searching'); $('q').focus() }
  if(e.key==='f'||e.key==='F') $('ftog').click();
  /* Arrow keys worked inside the panel but not on the grid, so a keyboard
     reader had to Tab past every save button to reach the next garment.
     Up and down move by a row, which means asking the layout how many
     columns it is drawing rather than assuming. */
  if(e.key.indexOf('Arrow')===0){
    // one per card: the photo. The title carries a second [data-open] and
    // walking both makes every step half a card.
    var cards=[].slice.call(document.querySelectorAll('#grid .shot[data-open]'));
    if(!cards.length) return;
    // resolve through the card, not the focused control: from the title
    // button or the save button, closest('[data-open]') found something that
    // is not in cards, and every arrow key threw focus back to card 1
    var ae=document.activeElement;
    var host=ae&&ae.closest?ae.closest('article'):null;
    var at=host?cards.indexOf(host.querySelector('.shot[data-open]')):-1;
    if(at<0 && !(ae&&ae.closest&&ae.closest('#grid'))) return;
    var cols=1, g=$('grid');
    try{ cols=getComputedStyle(g).gridTemplateColumns.split(' ').filter(Boolean).length }catch(err){}
    var step = e.key==='ArrowRight'?1 : e.key==='ArrowLeft'?-1 :
               e.key==='ArrowDown'?cols : e.key==='ArrowUp'?-cols : 0;
    if(!step) return;
    e.preventDefault();
    var n = at<0 ? 0 : at+step;
    if(n<0) n=0;
    if(n>=cards.length){
      // walking off the end loads the next batch rather than stopping dead
      if(!$('more').hidden){ paint(false);
        cards=[].slice.call(document.querySelectorAll('#grid .shot[data-open]')) }
      if(n>=cards.length) n=cards.length-1;
    }
    cards[n].focus({preventScroll:false});
  }
});
$('moreBtn').addEventListener('click',function(){paint(false)});
var kbd=document.querySelector('.kbd'); if(kbd) kbd.classList.add('show');
window.addEventListener('scroll',function(){
  $('top').classList.toggle('show',window.scrollY>1400);
  if(kbd) kbd.classList.toggle('show',window.scrollY<240);
  if($('more').hidden) return;
  if($('more').getBoundingClientRect().top<window.innerHeight+900) paint(false);
},{passive:true});
$('top').addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});

/* ── data ── */
function fail(msg){
  $('grid').innerHTML='';
  $('empty').hidden=false;
  $('empty').innerHTML='<span class="lbl">불러오기 실패</span><span style="color:var(--soft)">'+esc(msg)+'</span>';
}
(function load(){
  // read before boot: apply() rewrites the address from the filters
  try{ BOOTITEM=paramOf(location.search,'item') }catch(e){}
  try{ KEEPIN=readKeep(location.hash) }catch(e){ KEEPIN=null }
  var el=document.getElementById('__data');
  var txt=el?el.textContent.trim():'';
  if(txt && txt.charAt(0)==='{'){
    var parsed=null;
    try{ parsed=JSON.parse(txt) }catch(e){ fail('데이터 손상: '+e.message); return }
    if(parsed && parsed.items){
      // boot dereferences d.counts and d.rates; if either is missing the throw
      // used to escape and leave a masthead over nothing, with no explanation
      try{ boot(parsed) }catch(e){ fail('데이터 형식 오류: '+e.message) }
      return;
    }
  }
  fetch('archive.json').then(function(r){return r.json()}).then(boot)
    .catch(function(err){ fail(err.message) });
})();
})();
</script>
